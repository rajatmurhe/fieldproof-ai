services:
  # The unified Backend + Worker service (100% Free Forever)
  - type: web
    name: fieldproof-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: ./start.sh
    envVars:
      - key: DATABASE_URL
        sync: false # You will paste your Neon URL here
      - key: GEMINI_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Your frontend origin, e.g. https://fieldproof-frontend.onrender.com
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false # Same frontend origin
      # Free tier has no separate worker service: run it inside the API.
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      # Free tier disk is ephemeral: store videos in Supabase Storage (free).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: videos

  # The Next.js Frontend (100% Free Forever)
  - type: web
    name: fieldproof-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: fieldproof-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
